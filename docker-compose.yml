services:
  mcp:
    build:
      context: .
      network: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:29473:29473"
    env_file:
      - .env
    environment:
      - PORT=29473
      - OPENTICKERS_API_URL=${OPENTICKERS_API_URL:-http://api:3000}
    networks:
      - onerate-network
    restart: unless-stopped

networks:
  onerate-network:
    external: true
